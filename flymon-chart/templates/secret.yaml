{{- if .Values.useSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "flymon.fullname" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels: {{- include "flymon.labels" . | nindent 4 }}
type: Opaque
stringData:
  # 主服务：数据库 DSN 与 Redis 密码
  N9E_DSN: {{ .Values.config.database.dsn | quote }}
  N9E_REDIS_PASSWORD: {{ .Values.config.redis.password | default "" | quote }}
  {{- if .Values.gateway.enabled }}
  # Gateway：N9E API Token
  GATEWAY_N9E_API_TOKEN: {{ .Values.gateway.config.n9eApiToken | default "" | quote }}
  # Gateway：Redis 密码
  GATEWAY_REDIS_PASSWORD: {{ .Values.gateway.config.redisPassword | default "" | quote }}
  # Gateway：AI Token
  GATEWAY_OPENCLAW_API_TOKEN: {{ .Values.gateway.config.openclawApiToken | default "" | quote }}
  GATEWAY_IFLYELF_API_TOKEN: {{ .Values.gateway.config.iflyelfApiToken | default "" | quote }}
  {{- end }}
{{- end }}
