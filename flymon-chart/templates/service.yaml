apiVersion: v1
kind: Service
metadata:
  name: {{ include "flymon.fullname" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels: {{- include "flymon.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  {{- if and (eq .Values.service.type "ClusterIP") .Values.service.clusterIP }}
  clusterIP: {{ .Values.service.clusterIP }}
  {{- end }}
  {{- if .Values.service.sessionAffinity }}
  sessionAffinity: {{ .Values.service.sessionAffinity }}
  {{- end }}
  {{- with .Values.service.sessionAffinityConfig }}
  sessionAffinityConfig: {{- toYaml . | nindent 4 }}
  {{- end }}
  ports:
    - name: {{ .Values.service.portName }}
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
      {{- if and (or (eq .Values.service.type "NodePort") (eq .Values.service.type "LoadBalancer")) .Values.service.nodePort }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
    {{- if eq .Values.mode "center" }}
    - name: {{ .Values.service.ibexPortName }}
      port: {{ .Values.service.ibexPort }}
      targetPort: {{ .Values.service.ibexTargetPort }}
      protocol: TCP
      {{- if and (or (eq .Values.service.type "NodePort") (eq .Values.service.type "LoadBalancer")) .Values.service.ibexNodePort }}
      nodePort: {{ .Values.service.ibexNodePort }}
      {{- end }}
    {{- end }}
  selector: {{- include "flymon.selectorLabels" . | nindent 4 }}
